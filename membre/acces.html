<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accès membre - Integration Plus</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#0b1c2d;
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .box{
      background:#112a47;
      padding:30px;
      border-radius:12px;
      width:320px;
      text-align:center;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    input{
      width:100%;
      padding:12px;
      margin-top:12px;
      border-radius:8px;
      border:none;
      outline:none;
    }
    button{
      width:100%;
      padding:12px;
      margin-top:12px;
      border-radius:8px;
      border:none;
      background:#4fc4d3;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <!-- ✅ ICI : l’interface -->
  <div class="box">
    <h2>Accès Espace Membre</h2>

    <input
      type="text"
      id="code"
      placeholder="Entrez votre code d’accès"
    />

 <button id="btn-acceder" type="button" onclick="verifierCode()">
  Accéder
</button>

  </div>
  <hr>
  <!-- ✅ ICI : le script -->
 
<script>
  // ✅ Codes autorisés
  const CODES_CLAIRS = {
    "ESS-49-A9F3": "essentiel",
    "PRE-79-XP22": "premium",
    "EXC-149-ZA99": "excellence"
  };

  function verifierCode() {
    const input = document.getElementById("code");
    const code = (input?.value || "").trim().toUpperCase();

    if (!code) {
      alert("Merci de saisir un code");
      return;
    }

    const plan = CODES_CLAIRS[code];
    if (!plan) {
      alert("Code invalide");
      return;
    }

    localStorage.setItem("plan_acces", plan);

    if (plan === "essentiel") window.location.href = "espace-essentiel.html";
    if (plan === "premium") window.location.href = "espace-premium.html";
    if (plan === "excellence") window.location.href = "espace-excellence.html";
  }

  // ✅ Entrée = valider + clic bouton
  document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("code");
    const btn = document.getElementById("btn-acceder");

    if (input) {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") verifierCode();
      });
    }

    if (btn) {
      btn.addEventListener("click", verifierCode);
    }
  });
</script>


</body>
</html>
