<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accès membre - Integration Plus</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#0b1c2d;
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .box{
      background:#112a47;
      padding:30px;
      border-radius:12px;
      width:320px;
      text-align:center;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    input{
      width:100%;
      padding:12px;
      margin-top:12px;
      border-radius:8px;
      border:none;
      outline:none;
    }
    button{
      width:100%;
      padding:12px;
      margin-top:12px;
      border-radius:8px;
      border:none;
      background:#4fc4d3;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <!-- ✅ ICI : l’interface -->
  <div class="box">
    <h2>Accès Espace Membre</h2>

    <input
      type="text"
      id="code"
      placeholder="Entrez votre code d’accès"
    />

    <button onclick="verifierCode()">
      Accéder
    </button>
  </div>
  <hr>
  <!-- ✅ ICI : le script -->
 
<script>
  // ✅ Codes autorisés (en clair -> on calcule le hash)
  // Tu peux changer ces 3 codes si tu veux, mais garde le même format.
  const CODES_CLAIRS = {
    "ESS-49-A9F3": "essentiel",
    "PRE-79-XP22": "premium",
    "EXC-149-ZA99": "excellence"
  };

  async function sha256Hex(text) {
    const data = new TextEncoder().encode(text);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hashBuffer))
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }

  async function verifierCode() {
    const input = document.getElementById("code");
    const code = (input.value || "").trim().toUpperCase();

    if (!code) {
      alert("❌ Merci de saisir un code");
      return;
    }

    // 1) Vérifie que le code existe dans la liste
    const plan = CODES_CLAIRS[code];
    if (!plan) {
      alert("❌ Code invalide");
      return;
    }

    // 2) Stocke l’accès (simple)
    localStorage.setItem("plan_acces", plan);

    // 3) Redirige vers la bonne page
    if (plan === "essentiel") window.location.href = "espace-essentiel.html";
    if (plan === "premium") window.location.href = "espace-premium.html";
    if (plan === "excellence") window.location.href = "espace-excellence.html";
  }

  // ✅ Bonus : appuyer sur Entrée valide aussi
  document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("code");
    if (input) {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") verifierCode();
      });
    }
  });
</script>

</body>
</html>
