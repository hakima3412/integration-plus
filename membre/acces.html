<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accès membre - Integration Plus</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#0b1c2d;
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .box{
      background:#112a47;
      padding:30px;
      border-radius:12px;
      width:320px;
      text-align:center;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    input{
      width:100%;
      padding:12px;
      margin-top:12px;
      border-radius:8px;
      border:none;
      outline:none;
    }
    button{
      width:100%;
      padding:12px;
      margin-top:12px;
      border-radius:8px;
      border:none;
      background:#4fc4d3;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <!-- ✅ ICI : l’interface -->
  <div class="box">
    <h2>Accès Espace Membre</h2>

    <input
      type="text"
      id="code"
      placeholder="Entrez votre code d’accès"
    />

    <button onclick="verifierCode()">
      Accéder
    </button>
  </div>

  <!-- ✅ ICI : le script -->
  <script>
    const CODES = {
      "ESS-49-A9F3": "essentiel",
      "PRE-79-XP22": "premium",
      "EXC-149-ZA99": "excellence"
    };

    function verifierCode() {
      const code = document.getElementById("code").value.trim();

      // ✅ IMPORTANT : la condition correcte c’est "si le code n’existe pas"
      if (!CODES[code]) {
        alert("❌ Code invalide");
        return;
      }

      localStorage.setItem("code_actif", code);
      localStorage.setItem("formule", CODES[code]);
      const formule = CODES[code];

if (formule === "essentiel") {
  window.location.href = "espace-essentiel.html";
}

if (formule === "premium") {
  window.location.href = "espace-premium.html";
}

if (formule === "excellence") {
  window.location.href = "espace-excellence.html";
}


         }
  </script>

</body>
</html>
