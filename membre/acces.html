<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accès membre - Integration+</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#0b1c2d;
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .box{
      background:#112a47;
      padding:30px;
      border-radius:12px;
      width:320px;
      text-align:center;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    input{
      width:100%;
      padding:12px;
      margin-top:12px;
      border-radius:8px;
      border:none;
      outline:none;
    }
    button{
      width:100%;
      padding:12px;
      margin-top:12px;
      border-radius:8px;
      border:none;
      background:#4fc4d3;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <!-- ✅ ICI : l’interface -->
  <div class="box">
    <h2>Accès Espace Membre</h2>

    <input
      type="text"
      id="code"
      placeholder="Entrez votre code d’accès"
    />

 <button id="btn-acceder" type="button" onclick="verifierCode()">
  Accéder
</button>

  </div>
  <hr>
  <!-- ✅ ICI : le script -->
 
<script>
  // ✅ CODE ADMIN MASTER (accès à toutes les formules)
  const CODE_ADMIN = "ADMIN-2026-MASTER";

  // ✅ Codes fixes (anciens codes)
  const CODES_CLAIRS = {
    "ESS-49-A9F3": "essentiel",
    "PRE-79-XP22": "premium",
    "EXC-149-ZA99": "excellence"
  };

  function verifierCode() {
    const input = document.getElementById("code");
    const code = (input?.value || "").trim().toUpperCase();

    if (!code) {
      alert("Merci de saisir un code");
      return;
    }

    // ✅ Vérifier si c'est le code admin
    if (code === CODE_ADMIN) {
      localStorage.setItem("plan_acces", "excellence");
      localStorage.setItem("is_admin", "true");
      window.location.href = "espace-excellence.html";
      return;
    }

    // ✅ Vérifier les codes fixes
    let plan = CODES_CLAIRS[code];
    
    // ✅ Vérifier les codes générés automatiquement (depuis confirmation.html)
    // IMPORTANT: On vérifie que le code existe EXACTEMENT dans la base
    if (!plan) {
      const validCodes = JSON.parse(localStorage.getItem('valid_codes') || '{}');
      if (validCodes[code]) {
        // Vérifier que le préfixe correspond à la formule enregistrée
        const expectedPrefix = validCodes[code].prefix;
        if (code.startsWith(expectedPrefix + '-')) {
          plan = validCodes[code].formule;
        } else {
          alert("Code invalide. Ne modifiez pas votre code d'accès.");
          return;
        }
      }
    }

    // ❌ SUPPRIMÉ: On n'accepte PLUS les codes juste sur le format
    // Les codes doivent être enregistrés dans valid_codes

    if (!plan) {
      alert("Code invalide. Vérifiez votre code ou contactez le support.\n\nSi vous venez d'acheter, utilisez le code qui vous a été fourni sur la page de confirmation.");
      return;
    }

    localStorage.setItem("plan_acces", plan);

    if (plan === "essentiel") window.location.href = "espace-essentiel.html";
    if (plan === "premium") window.location.href = "espace-premium.html";
    if (plan === "excellence") window.location.href = "espace-excellence.html";
  }

  // ✅ Entrée = valider + clic bouton
  document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("code");
    const btn = document.getElementById("btn-acceder");

    if (input) {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") verifierCode();
      });
    }

    if (btn) {
      btn.addEventListener("click", verifierCode);
    }
  });
</script>


</body>
</html>
