<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accès membre - Integration Plus</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#0b1c2d;
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .box{
      background:#112a47;
      padding:30px;
      border-radius:12px;
      width:320px;
      text-align:center;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    input{
      width:100%;
      padding:12px;
      margin-top:12px;
      border-radius:8px;
      border:none;
      outline:none;
    }
    button{
      width:100%;
      padding:12px;
      margin-top:12px;
      border-radius:8px;
      border:none;
      background:#4fc4d3;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <!-- ✅ ICI : l’interface -->
  <div class="box">
    <h2>Accès Espace Membre</h2>

    <input
      type="text"
      id="code"
      placeholder="Entrez votre code d’accès"
    />

    <button onclick="verifierCode()">
      Accéder
    </button>
  </div>
  <hr>
  <!-- ✅ ICI : le script -->
 <script>
  // 🔐 Codes sécurisés (hash SHA-256 → formule)
  const CODE_HASH_TO_PLAN = {
    // ESS-49-A9F3
    "e6a39adad2f6bda9aedbe229e071037456f2724ff1fd9a7ff60d7a2ac00d9b03": "essentiel",

    // PRE-79-XP22
    "544468fc0f904d00f1a9009c274d8254bafc9e9464224d6dcc682271a6bad5ac": "premium",

    // EXC-149-ZA99
    "4067fac843188444a5333f4a71df73db232eddb538dc1a64704d994e29151551": "excellence"
  };

  async function sha256Hex(text) {
    const data = new TextEncoder().encode(text);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hashBuffer))
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }

  async function verifierCode() {
    const code = document.getElementById("code").value.trim().toUpperCase();

    if (!code) {
      alert("❌ Merci de saisir un code");
      return;
    }

    const hash = await sha256Hex(code);
    const plan = CODE_HASH_TO_PLAN[hash];

    if (!plan) {
      alert("❌ Code invalide");
      return;
    }

    // ✅ Accès illimité après paiement
    localStorage.setItem("plan_acces", plan);

    if (plan === "essentiel") window.location.href = "espace-essentiel.html";
    if (plan === "premium") window.location.href = "espace-premium.html";
    if (plan === "excellence") window.location.href = "espace-excellence.html";
  }
</script>

</body>
</html>
