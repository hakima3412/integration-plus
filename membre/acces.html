<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Accès membre – Integration Plus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family:Arial;background:#0b1c2d;color:white;display:flex;justify-content:center;align-items:center;height:100vh;">

  <div style="background:#112a47;padding:30px;border-radius:10px;width:320px;text-align:center;">
    <h2>Accès espace membre</h2>

    <input id="code" type="text" placeholder="Entrez votre code"
      style="width:100%;padding:12px;margin:15px 0;border-radius:6px;border:none;">

    <button onclick="verifierCode()"
      style="width:100%;padding:12px;background:#f4c430;border:none;border-radius:6px;font-weight:bold;cursor:pointer;">
      Accéder
    </button>
  </div>

<script>
const CODES = {
  "ESS-49-A9F3": "essentiel",
  "PRE-79-XP22": "premium",
  "EXC-149-ZA99": "excellence"
};

function verifierCode() {
  const code = document.getElementById("code").value.trim();

  if (!CODES[code]) {
    alert("❌ Code invalide");
    return;
  }

  localStorage.setItem("code_actif", code);
  localStorage.setItem("formule", CODES[code]);

  window.location.href = "espace-membre.html";
}
</script>

</body>
</html>
